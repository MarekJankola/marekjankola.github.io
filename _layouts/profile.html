<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.data.profile.name %}{{ page.title | escape }} · {% endif %}{{ site.data.profile.name | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="theme-color" content="#f6f5f2">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.data.profile.name | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}?v=research-spacing">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=mj" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      {% include profile-sidebar.html %}
      <main id="main" class="main-content" tabindex="-1">
        {% if page.url != '/' %}<a class="back-link" href="{{ '/' | relative_url }}">Back to home</a>{% endif %}
        <h1>{{ page.title | default: site.data.profile.name }}</h1>
        {{ content }}
      </main>
    </div>
  </body>
</html>
